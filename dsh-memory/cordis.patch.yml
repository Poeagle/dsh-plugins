# dsh-memory bundle patch. The package-root row is what the Web client scanner
# can see (`dsh-memory/settings` is a subpath and is ignored). The settings row
# owns the HTTP route and the `memory` settings namespace.
- insert:
    - id: memory-settings
      name: dsh-memory/settings
      config: {}
    - id: memory
      name: dsh-memory
      config: {}
